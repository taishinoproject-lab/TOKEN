name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # データ検証（npm run validate）は build の中で最初に実行される
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
