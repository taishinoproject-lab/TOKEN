# 毎日1回、Vercel の Deploy Hook を呼んで本番を作り直す。
# 「開催中・開催予定・終了」や「あと○日」は、ビルドした日の日付で HTML に書き込まれる部分があるため、
# データに変更がない日でも、日付が変わったら作り直す必要がある（終了した展示が残らないようにする）。
# Deploy Hook の URL は、リポジトリの Secrets（VERCEL_DEPLOY_HOOK_URL）に入れる。手順は docs/deploy.md の「毎日の再ビルド」。
name: 毎日の再ビルド

on:
  schedule:
    # 毎日 00:13（日本時間）。cron は UTC で書く。混雑する毎時0分を避けている
    # GitHub の定期実行は、混雑時に数分〜数十分遅れることがある
    - cron: "13 15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vercel の Deploy Hook を呼ぶ
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secrets に VERCEL_DEPLOY_HOOK_URL が登録されていません（docs/deploy.md の「毎日の再ビルド」を参照）"
            exit 1
          fi
          # URL は秘密の値なので、ログに出さない（GitHub は Secrets の値を自動で伏せるが、念のため echo しない）
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            -X POST "$DEPLOY_HOOK_URL"
          echo
          echo "Deploy Hook を呼びました。Vercel の Deployments で、本番のビルドが始まったことを確認できます。"
